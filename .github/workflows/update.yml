name: 주간 행사 업데이트

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 오전 9시(한국 시간)
  workflow_dispatch:       # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 해외 서버에서 문체부 사이트가 느려 약 20분 걸림
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 문체부 지역축제 목록으로 업데이트
        run: python3 update.py
      - name: 바뀐 내용 저장
        run: |
          git add data/events.js data/update-log.md
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "주간 행사 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
